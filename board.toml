# Xiaomi Mi Mix 3 5G (andromeda, SM8150) device repository for UniXNU.
# Forked from YangQi0408/UniXNU-cepheus (Xiaomi Mi 9, same SM8150, same Samsung
# EA8076 command-mode panel family, same ST-FTS touch on QUP SE17 I2C 0x49).
# The original Mi 9 configuration is kept as board.cepheus.toml.
#
# Memory values were measured on the phone (live FDT, 2026-11-06).
#
# The payload volume label is kept as "GUACESP" because the patched UniXNU
# firmware discovers the config by that label; it is cosmetic.

[board]
name = "andromeda"
soc = "SM8150"
description = "Xiaomi Mi Mix 3 5G (andromeda)"
kit = "cepheus"

[firmware]
config = "andromeda"
dsc = "Platforms/SurfaceDuo1Pkg/SurfaceDuo1NoSb.dsc"
fd = "Build/SurfaceDuo1Pkg/{target}_CLANGPDB/FV/SM8150_EFI.fd"
submodules = [
  "MU_BASECORE",
  "Common/MU",
  "Common/MU_OEM_SAMPLE",
  "Platforms/CranePkg",
  "Platforms/SurfaceDuoACPI",
  "Features/DFCI",
  "Features/CONFIG",
  "Binaries",
  "Platforms/OpensslPkg/Library/OpensslLib/openssl",
  "Platforms/MbedTlsPkg/Library/MbedTlsLib/mbedtls",
]
packages = [
  "{uefi}/Platforms",
  "{uefi}/Common/MU",
  "{uefi}/Common/MU_OEM_SAMPLE",
  "{uefi}/Features/DFCI",
  "{uefi}/Features/CONFIG",
  "{uefi}/Binaries",
  "{uefi}/Silicon/QC/Sm8150",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
]

[firmware.defines]
TARGET_DEVICE = "xiaomi-andromeda"
FDT = "andromeda.dtb"
SHARED_CRYPTO_PATH = "{edk2}/CryptoPkg/Binaries/edk2-basecrypto-driver-bin_extdep"
CONF_AUTOGEN_INCLUDE_PATH = "{uefi}/Common/MU/AndromedaPkg/Include"
MU_SCHEMA_DIR = "{uefi}/Common/MU/AndromedaPkg/CfgData"
MU_SCHEMA_FILE_NAME = "AndromedaPkgCfgData.xml"

[payload]
volume = "GUACESP"
size_mib = 34   # andromeda: 0x80800000 + 34 MiB = 0x82A00000, end of the "Kernel" region
loader = "firmware"
title = "Xiaomi Mi Mix 3 5G - XNU"
# Mi 9 reference values (cepheus live FDT /memory, 8 GiB unit):
#   reg = <0x0 0x80000000 0x0 0x3bb00000      # low  bank, ends 0xBBC00000
#         0x1 0x00000000 0x1 0x00000000      # high bank starts 0x100000000
#         0x0 0xc0000000 0x0 0xc0000000>     # mid  bank 0xC0000000..0x180000000
# Note the 52 MiB hole 0xBBC00000..0xC0000000 between the low and mid banks.
# dram-base stays 0xC0000000 (the contiguous 3 GiB mid bank, carve-out free);
# dram-size is the total the ADT advertises, i.e. up to the top of DRAM.
# Measured on the andromeda test unit (2026-11-06, live FDT /memory, MemTotal 5446192 kB):
#   reg = <0x0 0x80000000 0x0 0x3cc00000      # low  bank, ends 0xBCC00000
#         0x1 0x40000000 0x0 0xc0000000      # high bank 0x140000000..0x200000000
#         0x0 0xc0000000 0x0 0x80000000>     # mid  bank 0xC0000000..0x140000000
# Hole 0xBCC00000..0xC0000000; 0xC0000000..0x200000000 is one contiguous 5 GiB run.
dram_size = "0x180000000"   # 6 GiB unit
# panic_screen = true would run scripts/patch-xnu-entry-probe.py, which the
# pinned UniXNU commit (b6ae99c) does not ship, so the payload step would fail.
# Panics are still visible two ways: the screen (sweetfb_noconsole=0) and the
# USB live log (sweetusb=2). Revisit once that script is available.
panic_screen = false
timeout = 3
kernel_args = [
  # Boot-args length (andromeda, 2026-11-07): XNU 8796 reads 608 bytes
  # (BOOT_LINE_LENGTH, pexpert/pexpert/arm64/boot.h) but DarwinBoot fills a
  # 1024-byte field (Darwin 23 ABI): characters 608 and up never reach the
  # kernel, and 612-627 become bootFlags and memSizeActual (hw.memsize).
  # At 721 characters HFS sized its journal buffer from that text, got a
  # negative size and panicked at the first transaction. Keep the line
  # under 608 characters (scripts/build-payload.py refuses longer ones):
  # leave defaults (=0) out and add test switches with ANDROMEDA_ARGS.
  "debug=0xc",
  "serial=3",
  # All eight cores reached bsd_init in the cpu-match-fixed image. Reducing
  # cpus to 6 did not remove the SpringBoardUI assertion in our earlier test.
  "cpus=8",
  "keepsyms=1",
  # Boot speed (andromeda, 2026-11-06): startup_debug=1 (every STARTUP()
  # function) and -enable_kprintf_spam were essential until iOS reached
  # SpringBoard; now they only slow the boot. Put them back to pin a silent
  # stop to a function.
  "-noprogress",
  "rd=ufsroot0",
  # andromeda, phase 3: userdata now starts with the 16 GiB HFS+ iOS root
  # (build-root.sh, flashed 2026-11-06), so it is writable again. Phase 2 ran
  # with userdata read-only because it still held Android's data. The
  # persistent console log (ios-sweet 0047, on by default) writes the last
  # 4 MiB + 4 KiB of the 111 GiB partition, far past the HFS+ volume.
  "ufsrw=1",
  "rootrw=1",
  "unentitled_ios_sim_launch=1",
  "ignition_level=1",
  "wdt_test=no_user_checkin",
  "launchd_unsecure_cache=1",
  "wdt=-1",
  # USB: 0 off, 1 report controller state only, 2 device mode + CDC-ECM
  # network. 2 gives the live console: the kernel streams it as UDP to
  # 192.168.7.1:5140 while the phone is 192.168.7.2 on ue0. Host side:
  #   tools/sweet-usbnet.sh boot.log     (needs sudo for the address)
  "sweetusb=2",
  # Touch (ST-FTS on SE17, 0x49), as confirmed on the Mi 9: bit-banged I2C on
  # the SE17 pins (the GENI FIFO is GSI-only), an RPMh enable vote for ldoc1
  # (XOB, fixed 1.8 V, the same regulator here), and a 60 s delay so that
  # SpringBoard is up first. andromeda: reset on GPIO54 (SOUTH tile), 1.8 V
  # regulator enable on GPIO37 (only ever driven high: it is also
  # disp_vddio_vreg). Keys stay off until touch is verified.
  "sweettouch=1",
  # andromeda 2026-11-07: GENI SE17 hardware I2C (FIFO_DISABLE=0 here), as
  # Linux/TWRP use it; touch firmware 0x50 answers only 0xFF over GPIO I2C.
  "sweettouchgpio=0",
  "sweettouchpower=1",
  "sweettouchdelay=120",
  "sweettouchrst=54",
  "sweettouchvddio=37",
  # andromeda: the touch controller is unpowered until the driver raises its
  # rails (GPIO37 read 0), and without a reset it answered (chip id 36:39,
  # active scan ok) but reported no contacts. Linux pulses reset after the
  # supplies are stable: do the same. 2026-11-07: with firmware 0x50 the
  # pulse leaves the M3 core held (0x20000024 = 01, FIFO all 0xFF), while
  # power-up with reset already high booted it (warm2 test, event 03). Off.
  "sweettouchreset=0",
  # 2026-11-07: TWRP raw frame 99..688, ours flat at -5800 (analog front end
  # not sensing). Drive fp_vdd_vreg (GPIO92, regulator-always-on in the live
  # DT, no consumer) high as Linux does; its state is logged first.
  "sweettouchfpvdd=1",
  # Not set by default: andrboost=1 enables PM8150B GPIO5 (vdd_boost_vreg,
  # regulator-always-on in Linux) from andromeda_probe.c, if it reads off.
  # Bring-up: dump the first 60 non-empty FIFO events raw (the parser
  # recognised no contact so far). Remove once touch works.
  "sweettouchraw=200",
  # Scan settings byte. 0x01 (Xiaomi fts_521, multi-touch) sent before the
  # controller-ready event gave nothing; 0xff (ios-flame, Pixel 4) gave only
  # display-noise contacts, then silence after the IC recalibrated. The
  # experiment below starts from 0x01 after the ready event.
  "sweettouchscan=1",
  # Bring-up: every 20 s one controller command (charger mode, force
  # calibration, sense off/on, 0xff, register reset) while the user touches.
  # The experiment above ran on 2026-11-07 (6 steps, 0 touches) and is off now.
  # Read-only diagnostics instead: system info (FW/config/CX/AFE versions), then
  # 45 raw + strength frame summaries, one every 2 s, while the user touches.
  "sweettouchdiag=90",
  # Keys and Home as verified on the Mi 9 (patch 0083): power key via PON only,
  # one synthetic Home press after start so the lock screen opens even without
  # touch. andromeda: at 90 s it arrived 14 s before the lock screen was drawn
  # (display on 116 s after fastboot boot), so 150 s.
  "sweetkeys=1",
  "sweetkeyspononly=1",
  "sweethidtest=150",
  "sweethidonce=1",
  # Debug build: keep drawing kernel text over the GUI so the screen shows
  # where it stops. Set to 1 for a clean GUI (the console still reaches the
  # persistent log and the USB live log).
  "sweetfb_noconsole=1",
  "sweetfb_hz=30",
  # Show the whole iPhone X canvas (1125x2436) scaled by 0.96 onto the
  # 1080x2340 panel instead of the centered crop that cut the status bar
  # (patch 0094); touch follows the same mapping.
  "sweetfb_fit=1",
  # Adreno 640 (andromeda_gpu.c, port of ios-flame): 1 = read-only probe and
  # firmware check (GPUCC/SMMU/GMU read only when their clocks/power are on),
  # 2 = CX + GMU boot, 3 = GX + CP + ZAP, 4 = CP_MEM_WRITE test. One step per
  # boot, watching the log.
  "andrgpu=1",  # needs the kernel with andromeda_io_map() (commit 7dda8db)
  # Phase F4 (patch 0120, xnu/andromeda_gpu_present.c): with andrgpu=4 passing,
  # andrgpupresent=1 lets the GPU do the fitted panel copy of sweetfb_fit=1; the
  # first 8 GPU frames are compared with the CPU result (CRC-32,
  # andrgpupresentcheck=N); a difference, fence timeout or thermal stop turns it
  # off for the boot (CPU copy). 0 until step 4 has been seen to pass.
  # "andrgpupresent=0",  (default; not passed, see the boot-args length note)
  # Bring-up (andromeda_probe.c): 100 s after start, log Bluetooth UART pins,
  # clocks and SE13, Wi-Fi/BT regulators and the PM8150B charger/fuel gauge.
  # PMIC reads only; level 2 also sets the s3 clock vote briefly and restores
  # it. Remove once Bluetooth, Wi-Fi and charging have their own drivers.
  "andrprobe=2",  # needs the kernel with andromeda_io_map() (commit 7dda8db)
  # Camera slider: log the two Hall sensors (GPIO 42/114) whenever they
  # change, read only (andromeda_probe.c).
  "andrslider=1",  # needs the kernel with andromeda_io_map() (commit 7dda8db)
  # Slider opens the Camera app (patch 0097 + phone/andromedad): 1 = open is
  # hall42=0 hall114=1, 2 = reversed. Needs the iOS root with andromedad.
  # Verified on the phone 2026-11-07: slider open = hall42=0 hall114=1.
  "andrslidercam=1",
  # CPU at full clock (andromeda_cpufreq.c, method of ios-flame for the same
  # SoC): Gold/Prime drop to <= 1.4 GHz above 80 C and return below 70 C; an
  # unreadable temperature counts as hot.
  "andrcpu=1",
  # Load-based governor (andromeda_cpu_governor.h): frequency follows the
  # busiest core of each cluster, schedutil-style, with a short floor after
  # touches; andrcpu stays the cap and the thermal guard stays on top.
  "andrgov=1",
  # Real battery values for iOS (patch 0091 + andromeda_probe.c): PM8150B fuel
  # gauge and charger read over SPMI, no writes. 1 = ios-sweet's PM6150 path
  # (wrong PMIC here), absent = fixed 100 %.
  "sweetbattery=2",
  # Off in the main image; test image: ANDROMEDA_TAG=btbl
  # ANDROMEDA_ARGS="andrbt=1 andrbl=1" ./build-boot.sh
  # Bluetooth B1 (andromeda_bt.c, patch 0092): 150 s after start, WCN3990
  # power-on, EDL version, HCI_Reset, then off again.
  # B2 (andrbt=2): B1 power-on and EDL version, then the Qualcomm rampatch and
  # NVM from the ADT (/chosen btfw,<name>; scripts/pull-bt-fw.sh fills
  # inputs/andromeda/btfw), operating speed andrbtbaud (default 3000000, SE
  # clock 48 MHz), HCI_Reset + Read_Local_Version, then off again. Test image:
  # ANDROMEDA_TAG=bt2 ANDROMEDA_ARGS="andrbt=2" ./build-boot.sh
  # "andrbt=0",  (default; not passed, see the boot-args length note)
  # Brightness (andromeda_backlight.c, patch 0093): 1 = DCS 0x51 test 1023 ->
  # 256 -> 1023 from 30 s; 2 = also an AppleARMBacklight service for iOS.
  # "andrbl=0",  (default; not passed, see the boot-args length note)
  # Rear camera step C1 (andromeda_cam.c, patch 0098): 120 s after start,
  # power only the IMX363 (sequence of its vendor module file), read chip ID
  # 0x0016 over GPIO I2C on the CCI0 pins, then power it down. Test image:
  # ANDROMEDA_TAG=cam ANDROMEDA_ARGS="andrcam=1" ./build-boot.sh
  # "andrcam=0",  (default; not passed, see the boot-args length note)
  # Audio A0 (phone/andromeda-audio): AndromedaAudio.driver needs no boot-arg.
  # 1 = experiment: the Codec device also gets an output with mute and volume
  # on element 3, of which VirtualAudio should make the receiver port.
  # "andraudiorcv=0",  (default; not passed, see the boot-args length note)
  # Wi-Fi/modem first steps (andromeda_wlan.c, patch 0110, port of ios-flame's
  # wland): 1 = W0 (read-only checks), 2 = W1 (boot the modem through PAS and
  # wait for the SMP2P ready bit). W1 reads the firmware from the iOS root
  # under andrwlanfw (default /fw/modem), copied there by the root build from
  # inputs/andromeda/modemfw (scripts/pull-modem-fw.sh). Never together with
  # andrgpu=3 (both use the AOP QMP mailbox). Also andrwlandelay, andrwlanwait.
  # "andrwlan=0",  (default; not passed, see the boot-args length note)
  # Vibration test V1 (andromeda_haptics.c, patch 0135): andrhapdelay s after
  # start (default 60), the PM8150B haptics block is set up for the phone's
  # LRA (sequence of qti-haptics.c), two 200 ms pulses 2 s apart at <= 2552 mV
  # (andrhapmv can only go lower), then off and every changed register written
  # back. Test image, with the user holding the phone:
  # ANDROMEDA_TAG=hap ANDROMEDA_ARGS="andrhap=1" ./build-boot.sh
  # "andrhap=0",  (default; not passed, see the boot-args length note)
  # Power P0 (andromeda_power.c, patch 0100): every andrpwrsecs s (default 10)
  # one ANDROMEDA PWR line: per-CPU idle %, IRQ/IPI/WFI rates, share of idle
  # time in periods >= 4 ms, cost of the idle cache flush, FB/USB/keys/touch
  # polling rates, battery. Read only.
  # "andrpwr=0",  (default; not passed, see the boot-args length note)
  # Power P1, one change at a time (patches 0101-0105, all off): andridle=1 no
  # set/way L1 flush at each idle entry; andrfbpark=1 vsync timer stopped while
  # the display is off; andrusbidle=20 USB event polling every 20 ms after 1 s
  # without events; andrkeysidle=50 and andrtouchidle=100 slower key and touch
  # polling while the display is off. Test image, e.g.:
  # ANDROMEDA_TAG=pwr ANDROMEDA_ARGS="andrpwr=1 andrfbpark=1" ./build-boot.sh
  # "andridle=0",  (default; not passed, see the boot-args length note)
  # "andrfbpark=0",  (default; not passed, see the boot-args length note)
  # "andrusbidle=0",  (default; not passed, see the boot-args length note)
  # "andrkeysidle=0",  (default; not passed, see the boot-args length note)
  # "andrtouchidle=0",  (default; not passed, see the boot-args length note)
]

[payload.adt]
tool = "scripts/make-andromeda-adt.py"
unique_chip_id = "required"
# Kernel-managed window DarwinBoot allocates. It is NOT the DRAM size; see
# dram_size. andromeda: DarwinBoot needs ONE free UEFI memory-map entry this
# big; it places the window at ALIGN(entry start, 32 MiB) + 0x1004000 (the
# kernel base offset). EDK II refuses an AllocateAddress range that spans two
# entries (MdeModulePkg Page.c, "covers multiple entries"). This build has no
# PStore. The stock Aloha map splits the RAM at 0x180000000 (RamPartitionDxe
# adds the high RAM with different capabilities, so the DXE core does not
# merge 0x140000000..0x180000000 with 0x180000000..0x200000000): 3 GiB failed
# "Out of Resources", 2 GiB "Not Found", 1.5 GiB worked at 0x181004000 (USB
# DMA at 0x183b58000 in the logs). patches/aloha-andromeda-ram-merge.patch
# gives the high RAM the same capabilities: one 3 GiB entry from 0x140000000,
# window from 0x141004000, maximum 0xBEE00000. 0x60000000 keeps working with
# either UEFI; the 3 GiB test image is built with OWNED=0xBC000000 (see
# ANDROMEDA.md). The GPU pool (andrgpupool, default 0x1FF000000) stays above
# any window up to 0xBD000000.
owned_memory_size = "0x60000000"

[bootimg.image]
base = 0x0
kernel_offset = 0x8000
# The ABL adds abl_base (the "Kernel" RAM region at 0x80000000) to these
# offsets. 0x800000 puts the 64 MiB payload at 0x80800000-0x84800000, inside
# the reserved Kernel region (ends 0x82A00000 is too small for 64 MiB, so we
# use the documented guacamole placement that the ABL accepts).
ramdisk_offset = 0x800000
abl_base = 0x80000000
tags_offset = 0x100
pagesize = 4096
header_version = 0
