# Xiaomi Mi 9 (cepheus, SM8150) device repository for UniXNU.
# Forked from JohnLeeeeeee678/UniXNU-raphael (Redmi K20 Pro, same SM8150).
#
# cepheus is the SAME SM8150 SoC as OnePlus 7 Pro (guacamole), Redmi K20 Pro
# (raphael) and Xiaomi Pad 5 (nabu). The XNU kernel and the Project Aloha UEFI
# are reused from the proven guacamole SM8150 bring-up (which reached iOS
# 16.7.16 userland); only the device tree (cepheus.dtb) and the Apple Device
# Tree (ADT) device profile differ. Because the silicon is identical, cepheus
# reuses guacamole's exact kernel build -> NO per-device kernel defconfig.
#
# Every hardware number below was measured on the real phone (2026-10-31,
# serial 67eea163, hwversion 1.9.2, CN, MP):
#   /proc/meminfo MemTotal = 7655356 kB -> 8 GiB variant (Explorer edition)
#   /sys/firmware/fdt (live FDT, 646932 B) -> /memory reg, reserved-memory,
#       fts@49 touch node, cont_splash_region
#   /sys/block/sda/sda31/{start,size} -> userdata geometry
#
# The payload volume label is kept as "GUACESP" because the patched UniXNU
# firmware discovers the config by that label; it is cosmetic.

[board]
name = "cepheus"
soc = "SM8150"
description = "Xiaomi Mi 9 (cepheus)"
kit = "cepheus"

[firmware]
config = "cepheus"
dsc = "Platforms/SurfaceDuo1Pkg/SurfaceDuo1NoSb.dsc"
fd = "Build/SurfaceDuo1Pkg/{target}_CLANGPDB/FV/SM8150_EFI.fd"
submodules = [
  "MU_BASECORE",
  "Common/MU",
  "Common/MU_OEM_SAMPLE",
  "Platforms/CranePkg",
  "Platforms/SurfaceDuoACPI",
  "Features/DFCI",
  "Features/CONFIG",
  "Binaries",
  "Platforms/OpensslPkg/Library/OpensslLib/openssl",
  "Platforms/MbedTlsPkg/Library/MbedTlsLib/mbedtls",
]
packages = [
  "{uefi}/Platforms",
  "{uefi}/Common/MU",
  "{uefi}/Common/MU_OEM_SAMPLE",
  "{uefi}/Features/DFCI",
  "{uefi}/Features/CONFIG",
  "{uefi}/Binaries",
  "{uefi}/Silicon/QC/Sm8150",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
]

[firmware.defines]
TARGET_DEVICE = "xiaomi-cepheus"
FDT = "cepheus.dtb"
SHARED_CRYPTO_PATH = "{edk2}/CryptoPkg/Binaries/edk2-basecrypto-driver-bin_extdep"
CONF_AUTOGEN_INCLUDE_PATH = "{uefi}/Common/MU/AndromedaPkg/Include"
MU_SCHEMA_DIR = "{uefi}/Common/MU/AndromedaPkg/CfgData"
MU_SCHEMA_FILE_NAME = "AndromedaPkgCfgData.xml"

[payload]
volume = "GUACESP"
size_mib = 64
loader = "firmware"
title = "Xiaomi Mi 9 - XNU"
# Live FDT /memory (8 GiB unit):
#   reg = <0x0 0x80000000 0x0 0x3bb00000      # low  bank, ends 0xBBC00000
#         0x1 0x00000000 0x1 0x00000000      # high bank starts 0x100000000
#         0x0 0xc0000000 0x0 0xc0000000>     # mid  bank 0xC0000000..0x180000000
# Note the 52 MiB hole 0xBBC00000..0xC0000000 between the low and mid banks.
# dram-base stays 0xC0000000 (the contiguous 3 GiB mid bank, carve-out free);
# dram-size is the total the ADT advertises, i.e. up to the top of DRAM.
dram_size = "0x200000000"
# panic_screen = true would run scripts/patch-xnu-entry-probe.py, which the
# pinned UniXNU commit (b6ae99c) does not ship, so the payload step would fail.
# Panics are still visible two ways: the screen (sweetfb_noconsole=0) and the
# USB live log (sweetusb=2). Revisit once that script is available.
panic_screen = false
timeout = 3
kernel_args = [
  "debug=0xc",
  "serial=3",
  # All eight cores reached bsd_init in the cpu-match-fixed image. Reducing
  # cpus to 6 did not remove the SpringBoardUI assertion in our earlier test.
  "cpus=8",
  "keepsyms=1",
  # XNU prints every STARTUP() function it runs:
  #   kernel_startup_initialize_upto[subsystem, rank]: addr(arg)
  # plus "kernel_bootstrap: <name>" for each named step in kernel_bootstrap().
  # This is how a silent stop gets pinned to a function.
  "startup_debug=1",
  "-enable_kprintf_spam",
  "-noprogress",
  "rd=ufsroot0",
  "unentitled_ios_sim_launch=1",
  "ignition_level=1",
  "wdt_test=no_user_checkin",
  "ufsrw=1",
  "rootrw=1",
  "launchd_unsecure_cache=1",
  "wdt=-1",
  # USB: 0 off, 1 report controller state only, 2 device mode + CDC-ECM
  # network. 2 gives the live console: the kernel streams it as UDP to
  # 192.168.7.1:5140 while the phone is 192.168.7.2 on ue0. Host side:
  #   tools/sweet-usbnet.sh boot.log     (needs sudo for the address)
  "sweetusb=2",
  # Input is deliberately disabled while validating the userspace root.
  # Enable one driver at a time after SpringBoard starts successfully.
  "sweettouch=0",
  "sweetkeys=0",
  # Debug build: keep drawing kernel text over the GUI so the screen shows
  # where it stops. Set to 1 for a clean GUI (the console still reaches the
  # persistent log and the USB live log).
  "sweetfb_noconsole=0",
  "sweetfb_hz=30",
  "sweetgpu=3",
  "sweetlogdump=1",
]

[payload.adt]
tool = "scripts/make-cepheus-adt.py"
unique_chip_id = "required"
# Match the working guacamole shim window: a 3 GiB kernel-managed window is
# what the SM8150 bring-up needs to reserve early I/O page tables for the
# 36 MiB cont_splash framebuffer. It is NOT the DRAM size; see dram_size.
owned_memory_size = "0xc0000000"

[bootimg.image]
base = 0x0
kernel_offset = 0x8000
# The ABL adds abl_base (the "Kernel" RAM region at 0x80000000) to these
# offsets. 0x800000 puts the 64 MiB payload at 0x80800000-0x84800000, inside
# the reserved Kernel region (ends 0x82A00000 is too small for 64 MiB, so we
# use the documented guacamole placement that the ABL accepts).
ramdisk_offset = 0x800000
abl_base = 0x80000000
tags_offset = 0x100
pagesize = 4096
header_version = 0
