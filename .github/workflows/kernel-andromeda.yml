name: kernel-andromeda

# SM8150 XNU 8796 kernel (MACHINE_CONFIG=SWEET) for the Mi Mix 3 5G.
#
# Generated from the Mi 9 port's touch-kernel workflow (YangQi0408/UniXNU-cepheus,
# branch feat/adreno640, kept in docs/cepheus-workflows/touch-kernel.yml): same
# staged sources, patches (0082 touch, 0083 performance, 0084 touch power,
# 0085-0088 SoC/ARC/pmap), host tests and post-build checks. The checkout stays
# at path "cepheus" because the device scripts use that path.
#
# andromeda differences live in the sources (touch pins via sweettouchrst= /
# sweettouchvddio=) and in board.toml boot-args, not here. Only open-source
# inputs; no IPSW. Manual start; artifacts expire after 7 days.
on:
  workflow_dispatch:
permissions:
  contents: read
# One kernel build at a time.
concurrency:
  group: kernel-andromeda
  cancel-in-progress: false
jobs:
  kernel:
    # macos-15 now aliases arm64 hosts; explicitly retain the Intel build host
    # and Xcode16.2. Target ARCHS remains arm64, not the runner architecture.
    runs-on: macos-15-intel
    timeout-minutes: 150
    env:
      MACOS_VERSION: "13.5"
      MACHINE_CONFIG: SWEET
      KERNEL_CONFIG: DEVELOPMENT
      DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4
        with:
          path: cepheus
      - uses: actions/checkout@v4
        with:
          repository: dipa-studio/ios-sweet
          ref: 45263bee51df4a0f55cdf9c649af886399488ddb
          path: ios-sweet
      - name: Stage pinned sources and cepheus driver
        run: |
          set -euo pipefail
          git init -q dxb
          git -C dxb fetch -q --depth 1 https://github.com/blacktop/darwin-xnu-build "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          bash cepheus/scripts/build-kernel-patches.sh ios-sweet
          cp ios-sweet/xnu/patches/*.patch ios-sweet/xnu/patches/*.sh dxb/patches/
          cp cepheus/xnu/cepheus_touch.c cepheus/xnu/cepheus_fts_events.h cepheus/xnu/cepheus_clock_status.h cepheus/xnu/cepheus_gpi_layout.h dxb/patches/
          cp cepheus/xnu/cepheus_i2c_bitbang.h dxb/patches/
          cp cepheus/xnu/cepheus_soc.c cepheus/xnu/cepheus_soc.h dxb/patches/
          cp cepheus/xnu/cepheus_cpu_policy.h dxb/patches/
          cp cepheus/xnu/cepheus_gpu_power.h dxb/patches/
          cp cepheus/xnu/cepheus_arc.h cepheus/xnu/cepheus_arc_probe.h dxb/patches/
          cp cepheus/xnu/cepheus_bcm.h dxb/patches/
          cp cepheus/xnu/andromeda_probe.c cepheus/xnu/andromeda_cpufreq.c cepheus/xnu/andromeda_cpu_governor.h dxb/patches/
          cp cepheus/xnu/andromeda_gpu.c cepheus/xnu/andromeda_gpu_core.c cepheus/xnu/andromeda_gpu.h dxb/patches/
          cp cepheus/xnu/SweetAMFI.cpp dxb/patches/
          cp cepheus/xnu/andromeda_slider.c cepheus/xnu/andromeda_slider.h dxb/patches/
          cp cepheus/xnu/andromeda_bt.c cepheus/xnu/andromeda_backlight.c cepheus/xnu/AndromedaBacklight.cpp dxb/patches/
          cp cepheus/xnu/0092-andromeda-bt-rpmh.patch dxb/patches/
          cp cepheus/xnu/andromeda_cam.c cepheus/xnu/0098-andromeda-cam-rpmh.patch dxb/patches/
          cp cepheus/xnu/andromeda_wlan.c dxb/patches/
          cp cepheus/xnu/andromeda_power.c cepheus/xnu/andromeda_power.h dxb/patches/
          # Power P1 straight into dxb/patches: 0102-0104 change files that the 0083 generator rewrites.
          cp cepheus/xnu/0101-andromeda-idle-cache.patch cepheus/xnu/0102-andromeda-fb-vsync-park.patch cepheus/xnu/0103-andromeda-usb-idle-poll.patch cepheus/xnu/0104-andromeda-keys-idle-poll.patch dxb/patches/
          for file in cepheus_gpu_memory.cpp cepheus_gpu_memory.h cepheus_gpu_compile.c cepheus_gpu_compile.h \
            cepheus_gpu_memory_state.h \
            cepheus_gmu_upload_mmio.h \
            cepheus_qmp_connect.h \
            cepheus_gpu_tsens.h \
            cepheus_cp_ring_config.h \
            cepheus_cp_protection.h \
            cepheus_cp_snapshot_mmio.h \
            cepheus_cp_workspace.c cepheus_cp_workspace.h \
            cepheus_gpu_vm39.h \
            cepheus_gx_core.h \
            cepheus_gx_perfcounter.h cepheus_cp_preinit.h cepheus_gx_gbif.h cepheus_gx_llc.h cepheus_scm_discovery.h cepheus_gx_va_layout.h cepheus_gx_hwcg.h cepheus_cp_unsecure_gate.h \
            cepheus_gx_smmu_plan.h \
            cepheus_gmu_workspace.c cepheus_gmu_workspace.h \
            cepheus_gpu_retire.c cepheus_gpu_retire.h cepheus_gpu_memory_private.h \
            cepheus_gmu_hfi_link.c cepheus_gmu_hfi_link.h \
            cepheus_gmu_mmio.h cepheus_gpu_config.h cepheus_qmp_mmio.h cepheus_gmu_retire_mmio.h cepheus_pdc_mmio.h cepheus_gpu_fault_mmio.h \
            cepheus_gmu_bringup.c cepheus_gmu_bringup.h \
            cepheus_hfi.h cepheus_hfi_boot.h cepheus_hfi_messages.h cepheus_hfi_session.h \
            cepheus_gmu_firmware.h cepheus_gmu_upload.h cepheus_smmu_plan.h cepheus_smmu_install.h \
            cepheus_gpu_power_txn.h cepheus_gpu_submit.h cepheus_gmu_start.h \
            cepheus_gpu_ring.h cepheus_a640_pm4.h cepheus_sqe.h cepheus_gpu_bw.h cepheus_gpu_firmware.h cepheus_gpu_fault.h cepheus_gpu_vm.h cepheus_gpu_va.h cepheus_gpu_pdc.h cepheus_gpu_bin.h cepheus_gpu_thermal.h cepheus_cp_init.h cepheus_smmu_detach.h cepheus_gmu_park.h cepheus_gmu_slumber.h cepheus_cp_protect.h cepheus_qmp_acd.h cepheus_smmu_geometry.h cepheus_smmu_mmio.h cepheus_gmu_oob.h; do
            cp "cepheus/xnu/$file" dxb/patches/
          done
          # Retain the verified one-shot Home, PON-only keys and fast blank.
          python3 cepheus/scripts/prepare-performance-patch.py ios-sweet/xnu/patches dxb/patches/0083-cepheus-performance.patch
          python3 cepheus/scripts/test-performance.py
          python3 cepheus/scripts/prepare-touch-power-patch.py ios-sweet/xnu/patches dxb/patches/0084-cepheus-touch-power.patch
          python3 cepheus/scripts/test-touch-power.py ios-sweet/xnu/patches
          python3 cepheus/scripts/test-andromeda-bt-rpmh.py ios-sweet/xnu/patches
          python3 cepheus/scripts/test-gpu-arc.py ios-sweet/xnu/patches
          python3 cepheus/scripts/test-gpu-integration.py
          python3 cepheus/scripts/test-pmap-cache-pa.py
          python3 cepheus/scripts/test-pmap-cache-verifier.py
          python3 cepheus/scripts/test-tree.py
          python3 cepheus/scripts/test-gpu-fdt.py
          python3 cepheus/scripts/test-gpu-diagnostic-log.py
          python3 cepheus/scripts/test-zap-layout.py
          bash cepheus/scripts/test-gpu-memory-host.sh
          # The SWEET kernel is plain arm64, not arm64e.
          python3 -c 'from pathlib import Path; p=Path("dxb/build.sh"); s=p.read_text(); old="ARCHS=\"x86_64 arm64e\" VALID_ARCHS=\"x86_64 arm64e\""; assert s.count(old)==1; p.write_text(s.replace(old,"ARCHS=\"x86_64 arm64e arm64\" VALID_ARCHS=\"x86_64 arm64e arm64\""))'
      - name: Toolchain and event parser regression
        run: |
          set -euo pipefail
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          test -d /Applications/Xcode_16.2.app
          echo "DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version
          xcrun --find iig
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_fts_events.c -o /tmp/fts-test
          /tmp/fts-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_i2c_bitbang.c -o /tmp/i2c-test
          /tmp/i2c-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_soc.c -o /tmp/soc-test
          /tmp/soc-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_cpu_policy.c -o /tmp/policy-test
          /tmp/policy-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_andromeda_cpu_governor.c -o /tmp/governor-test
          /tmp/governor-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_andromeda_slider.c -o /tmp/slider-test
          /tmp/slider-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_a640_pm4.c -o /tmp/pm4-test
          /tmp/pm4-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_gmu_firmware.c -o /tmp/gmu-test
          /tmp/gmu-test
          bash cepheus/scripts/test-gpu-sanitizers.sh
          bash cepheus/scripts/test-gpu-stack.sh
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_gpu_config.c -o /tmp/ceph-config
          /tmp/ceph-config
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_qmp_mmio.c -o /tmp/ceph-qmp-mmio
          /tmp/ceph-qmp-mmio
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_gmu_retire_mmio.c -o /tmp/ceph-retire-mmio
          /tmp/ceph-retire-mmio
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_pdc_mmio.c -o /tmp/ceph-pdc-mmio
          /tmp/ceph-pdc-mmio
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_gpu_fault_mmio.c -o /tmp/ceph-fault-mmio
          /tmp/ceph-fault-mmio
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_gmu_upload_mmio.c -o /tmp/ceph-upload-mmio
          /tmp/ceph-upload-mmio
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_qmp_connect.c -o /tmp/ceph-qmp-connect
          /tmp/ceph-qmp-connect
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_gpu_tsens.c -o /tmp/ceph-gpu-tsens
          /tmp/ceph-gpu-tsens
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_cp_ring_config.c -o /tmp/ceph-cp-ring
          /tmp/ceph-cp-ring
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_cp_protection.c -o /tmp/ceph-cp-protection
          /tmp/ceph-cp-protection
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_cp_snapshot_mmio.c -o /tmp/ceph-cp-snapshot
          /tmp/ceph-cp-snapshot
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_gpu_vm39.c -o /tmp/ceph-gpu-vm39
          /tmp/ceph-gpu-vm39
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_gx_core.c -o /tmp/ceph-gx-core
          /tmp/ceph-gx-core
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_gpu_keepalive.c -o /tmp/ceph-keepalive
          /tmp/ceph-keepalive
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_gx_smmu_plan.c -o /tmp/ceph-gx-plan
          /tmp/ceph-gx-plan
          for name in gpu_power gpu_power_txn gpu_memory_state gpu_firmware gpu_fault gpu_pdc gpu_thermal gmu_loader gmu_upload gmu_start gmu_park gmu_slumber gmu_oob gmu_mmio hfi hfi_messages hfi_session gpu_vm gpu_va smmu_plan smmu_geometry smmu_mmio smmu_install smmu_detach gpu_submit gpu_ring cp_init qmp_acd sqe arc bcm gpu_bw; do
            cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined "cepheus/xnu/test_${name}.c" -o "/tmp/ceph-${name}"
            "/tmp/ceph-${name}"
          done
      - name: GPU production host static analysis
        run: python3 cepheus/scripts/analyze-gpu-host.py
      - name: Restricted SCM AArch64 codegen (never executed)
        run: python3 cepheus/scripts/test-scm-codegen.py
      - name: Build XNU
        working-directory: dxb
        run: |
          set -euo pipefail
          bash build.sh 2>&1 | tee build.log
      - name: Fail if required patches or cepheus source were skipped
        run: |
          set -euo pipefail
          grep -F 'Applying patch:' dxb/build.log | grep -F '0082-cepheus-touch.patch'
          if grep 'Skipping patch' dxb/build.log | grep -E '(0003-|0018-|0028-|0038-|0046-|0058-|0064-|0065-|0067-|0075-|0077-|0078-|0082-|0083-|0084-|0085-|0086-|0087-|0088-|0089-|0090-|0091-|0092-|0093-|0094-|0096-|0097-|0098-|0100-|0101-|0102-|0103-|0104-|0110-)'; then
            echo 'critical patch skipped' >&2; exit 1
          fi
          grep -E '^bsd/dev/cepheus_touch.c[[:space:]]+standard$' dxb/xnu/bsd/conf/files
          ! grep -E '^bsd/dev/sweet_touch.c[[:space:]]+standard$' dxb/xnu/bsd/conf/files
          cmp cepheus/xnu/cepheus_touch.c dxb/xnu/bsd/dev/cepheus_touch.c
          cmp cepheus/xnu/cepheus_fts_events.h dxb/xnu/bsd/dev/cepheus_fts_events.h
          cmp cepheus/xnu/cepheus_clock_status.h dxb/xnu/bsd/dev/cepheus_clock_status.h
          cmp cepheus/xnu/cepheus_gpi_layout.h dxb/xnu/bsd/dev/cepheus_gpi_layout.h
          cmp cepheus/xnu/cepheus_i2c_bitbang.h dxb/xnu/bsd/dev/cepheus_i2c_bitbang.h
          mkdir out
          K=dxb/fakeroot/System/Library/Kernels/kernel.development.sweet
          python3 cepheus/scripts/verify-touch-kernel.py "$K"
          # andromeda: the touch driver must carry the configurable pins.
          python3 -c 'from pathlib import Path; d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes(); assert b"pins reset=%u vddio=%u" in d and b"allowed 12/54, 84/37" in d and b"controller ready %s" in d and b"sweettouchscan" in d and b"sweettouchexp" in d'
          grep 'Applying patch:' dxb/build.log | grep 0084-cepheus-touch-power.patch
          grep 'Applying patch:' dxb/build.log | grep 0085-cepheus-soc.patch
          cmp cepheus/xnu/cepheus_soc.c dxb/xnu/bsd/dev/cepheus_soc.c
          cmp cepheus/xnu/cepheus_gpu_power.h dxb/xnu/bsd/dev/cepheus_gpu_power.h
          cmp cepheus/xnu/cepheus_arc.h dxb/xnu/bsd/dev/cepheus_arc.h
          cmp cepheus/xnu/cepheus_arc_probe.h dxb/xnu/bsd/dev/cepheus_arc_probe.h
          grep -F '#include "cepheus_arc_probe.h"' dxb/xnu/bsd/dev/sweet_rpmh.c
          python3 -c 'from pathlib import Path; d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes(); assert b"CEPHEUS ARC:" in d and b"cepharc" in d'
          python3 cepheus/scripts/verify-gpu-kernel.py dxb/xnu "$K"
          grep -F 'Applying patch:' dxb/build.log | grep -F '0088-cepheus-pmap-cache-pa.patch'
          python3 -c 'from pathlib import Path; s=Path("dxb/xnu/osfmk/arm/pmap/pmap.c").read_text(); assert "flush_dcache((vm_offset_t) ptoa(pp), PAGE_SIZE, TRUE);" in s; assert "(pp << PAGE_SHIFT)" not in s'
          python3 cepheus/scripts/verify-pmap-cache-kernel.py "$K"
          # andromeda: read-only BT/Wi-Fi/charger probe (andrprobe=1).
          grep -F 'Applying patch:' dxb/build.log | grep -F '0089-andromeda-probe.patch'
          grep -E '^bsd/dev/andromeda_probe.c[[:space:]]+standard$' dxb/xnu/bsd/conf/files
          cmp cepheus/xnu/andromeda_probe.c dxb/xnu/bsd/dev/andromeda_probe.c
          grep -E '^bsd/dev/andromeda_cpufreq.c[[:space:]]+standard$' dxb/xnu/bsd/conf/files
          cmp cepheus/xnu/andromeda_cpufreq.c dxb/xnu/bsd/dev/andromeda_cpufreq.c
          cmp cepheus/xnu/andromeda_cpu_governor.h dxb/xnu/bsd/dev/andromeda_cpu_governor.h
          # andromeda: Adreno 640 bring-up (patch 0090, andrgpu=N).
          grep -F 'Applying patch:' dxb/build.log | grep -F '0090-andromeda-gpu.patch'
          grep -E '^bsd/dev/andromeda_gpu.c[[:space:]]+standard$' dxb/xnu/bsd/conf/files
          grep -E '^bsd/dev/andromeda_gpu_core.c[[:space:]]+standard$' dxb/xnu/bsd/conf/files
          cmp cepheus/xnu/andromeda_gpu.c dxb/xnu/bsd/dev/andromeda_gpu.c
          cmp cepheus/xnu/andromeda_gpu_core.c dxb/xnu/bsd/dev/andromeda_gpu_core.c
          cmp cepheus/xnu/andromeda_gpu.h dxb/xnu/bsd/dev/andromeda_gpu.h
          python3 -c 'from pathlib import Path; d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes(); assert b"ANDROMEDA GPU:" in d and b"andrgpu" in d'
          # andromeda: whole iPhone X canvas scaled onto the panel (sweetfb_fit=1).
          grep -F 'Applying patch:' dxb/build.log | grep -F '0094-andromeda-display-fit.patch'
          python3 -c 'from pathlib import Path; d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes(); assert b"sweetfb_fit" in d and b"SWEET FB: fit" in d'
          # andromeda: Bluetooth B1 (0092, andrbt=1) and DSI brightness (0093, andrbl=1/2).
          grep -F 'Applying patch:' dxb/build.log | grep -F '0092-andromeda-bt.patch'
          grep -F 'Applying patch:' dxb/build.log | grep -F '0092-andromeda-bt-rpmh.patch'
          grep -E '^bsd/dev/andromeda_bt.c[[:space:]]+standard$' dxb/xnu/bsd/conf/files
          cmp cepheus/xnu/andromeda_bt.c dxb/xnu/bsd/dev/andromeda_bt.c
          grep -F 'andromeda_rpmh_bt_rail' dxb/xnu/bsd/dev/sweet_rpmh.c
          grep -F 'Applying patch:' dxb/build.log | grep -F '0093-andromeda-backlight.patch'
          grep -E '^bsd/dev/andromeda_backlight.c[[:space:]]+standard$' dxb/xnu/bsd/conf/files
          grep -E '^iokit/Kernel/arm/AndromedaBacklight.cpp[[:space:]]+optional iokitcpp$' dxb/xnu/iokit/conf/files.arm64
          cmp cepheus/xnu/andromeda_backlight.c dxb/xnu/bsd/dev/andromeda_backlight.c
          cmp cepheus/xnu/AndromedaBacklight.cpp dxb/xnu/iokit/Kernel/arm/AndromedaBacklight.cpp
          python3 -c 'from pathlib import Path; d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes(); assert all(s in d for s in (b"ANDROMEDA BT:", b"andrbtdelay", b"ANDROMEDA RPMH:", b"ANDROMEDA BL:", b"andrbllevel", b"AppleARMBacklight"))'
          # andromeda: slider -> Camera app (patch 0097, andrslidercam).
          grep -F 'Applying patch:' dxb/build.log | grep -F '0097-andromeda-slider.patch'
          grep -E '^bsd/dev/andromeda_slider.c[[:space:]]+standard$' dxb/xnu/bsd/conf/files
          cmp cepheus/xnu/andromeda_slider.c dxb/xnu/bsd/dev/andromeda_slider.c
          cmp cepheus/xnu/andromeda_slider.h dxb/xnu/bsd/dev/andromeda_slider.h
          grep -F 'andromeda_slider_publish(h42, h114)' dxb/xnu/bsd/dev/andromeda_probe.c
          python3 -c 'from pathlib import Path; d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes(); assert b"ANDROMEDA SLIDERCAM:" in d and b"andrslidercam" in d and b"slider_wait" in d'
          # andromeda: rear camera IMX363 chip ID, step C1 (patch 0098, andrcam=1).
          grep -F 'Applying patch:' dxb/build.log | grep -F '0098-andromeda-cam.patch'
          grep -F 'Applying patch:' dxb/build.log | grep -F '0098-andromeda-cam-rpmh.patch'
          grep -E '^bsd/dev/andromeda_cam.c[[:space:]]+standard$' dxb/xnu/bsd/conf/files
          cmp cepheus/xnu/andromeda_cam.c dxb/xnu/bsd/dev/andromeda_cam.c
          grep -F 'andromeda_rpmh_cam_rail' dxb/xnu/bsd/dev/sweet_rpmh.c
          grep -F 'andromeda_cam_init();' dxb/xnu/bsd/dev/cepheus_touch.c
          python3 -c 'from pathlib import Path; d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes(); assert all(s in d for s in (b"ANDROMEDA CAM:", b"andrcamdelay", b"andrcamaddr", b"not an andromeda camera rail"))'
          # andromeda: Wi-Fi/modem W0-W1 (patch 0110, andrwlan=N).
          grep -F 'Applying patch:' dxb/build.log | grep -F '0110-andromeda-wlan.patch'
          grep -E '^bsd/dev/andromeda_wlan.c[[:space:]]+standard$' dxb/xnu/bsd/conf/files
          cmp cepheus/xnu/andromeda_wlan.c dxb/xnu/bsd/dev/andromeda_wlan.c
          python3 -c 'from pathlib import Path; d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes(); assert b"ANDROMEDA WLAN:" in d and b"andrwlan" in d'
          # andromeda: power P0/P1 (patches 0100-0105), all off by default.
          for p in 0100-andromeda-power-stats 0101-andromeda-idle-cache 0102-andromeda-fb-vsync-park 0103-andromeda-usb-idle-poll 0104-andromeda-keys-idle-poll; do grep -F 'Applying patch:' dxb/build.log | grep -F "$p.patch"; done
          grep -E '^bsd/dev/andromeda_power.c[[:space:]]+standard$' dxb/xnu/bsd/conf/files
          cmp cepheus/xnu/andromeda_power.c dxb/xnu/bsd/dev/andromeda_power.c
          cmp cepheus/xnu/andromeda_power.h dxb/xnu/bsd/dev/andromeda_power.h
          grep -F 'andromeda_power_init();' dxb/xnu/bsd/dev/sweet_ufs.c
          grep -F 'andromeda_display_wait(touch_idle_ms);' dxb/xnu/bsd/dev/cepheus_touch.c
          python3 -c 'from pathlib import Path; d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes(); assert all(s in d for s in (b"ANDROMEDA PWR:", b"andrpwrsecs", b"andridle", b"andrfbpark", b"vsync parked", b"andrusbidle", b"andrusbidlewin", b"andrkeysidle", b"andrtouchidle"))'
          # andromeda: AMFI trust-query stand-in (patch 0096, port of ios-flame 0103).
          grep -F 'Applying patch:' dxb/build.log | grep -F '0096-andromeda-amfi-trust.patch'
          cmp cepheus/xnu/SweetAMFI.cpp dxb/xnu/iokit/Kernel/arm/SweetAMFI.cpp
          python3 -c 'from pathlib import Path; d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes(); assert b"SWEET AMFI:" in d and b"AppleMobileFileIntegrity" in d'
          # andromeda: battery source for SweetBattery (sweetbattery=2).
          grep -F 'Applying patch:' dxb/build.log | grep -F '0091-andromeda-battery.patch'
          grep -F 'andromeda_battery_sample' dxb/xnu/iokit/Kernel/arm/SweetBattery.cpp
          python3 -c 'from pathlib import Path; d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes(); assert b"ANDROMEDA PROBE:" in d and b"andrprobe" in d and b"ANDROMEDA CPU:" in d and b"andrcpuhot" in d and b"andrgov" in d and b"PM8150B fuel gauge" in d and b"andrfastboot" in d and b"ANDROMEDA SLIDER:" in d and b"andrslider" in d'
          python3 -c 'from pathlib import Path; d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes(); assert b"CX_HW_CTRL=" in d; assert all(s not in d for s in (b"SWEET FASTBOOT:", b"sweetfastboot"))'
          python3 -c 'from pathlib import Path;d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes();assert all(s in d for s in (b"SWEET BLANK:",b"one-shot Home complete",b"SWEET GPI: SMMU"))'
          cp "$K" out/kernel.macho
          (cd out && shasum -a 256 kernel.macho > SHA256SUMS)
          git -C cepheus rev-parse HEAD > out/device-commit.txt
          git -C ios-sweet rev-parse HEAD > out/ios-sweet-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: andromeda-kernel
          path: out/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andromeda-kernel-build-log
          path: dxb/build.log
          if-no-files-found: ignore
