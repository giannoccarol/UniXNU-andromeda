name: kernel-andromeda

# Builds the SM8150 XNU 8796 kernel (MACHINE_CONFIG=SWEET) for the Mi Mix 3 5G.
#
# Same kernel as the Mi 9 (cepheus) port: identical SoC, and every cepheus
# addition is behind a boot-arg that board.toml leaves off (sweettouch=0,
# sweetkeys=0, no cephsoc), so nothing in it touches a Mi 9 pin unasked.
#
# Inputs are only open source: dipa-studio/ios-sweet (XNU patches and shims),
# blacktop/darwin-xnu-build (Apple's open-source XNU and its build), and the
# patches in this repository. No IPSW and no Apple binary is fetched here; the
# Apple Device Tree, the payload and the boot image are built locally.
#
# Manual start only. The artifact (kernel.macho) expires after 7 days.

on:
  workflow_dispatch:

permissions:
  contents: read

# One kernel build at a time: macOS minutes are billed 10x on private repos.
concurrency:
  group: kernel-andromeda
  cancel-in-progress: false

jobs:
  kernel:
    # macos-14 (Xcode 15) was retired on 2026-11-02 (actions/runner-images#13518),
    # and the macos-15 label now means arm64 hosts. Like the Mi 9 port since
    # 2026-11-05: the Intel host with Xcode 16.2, whose iig still emits the
    # IORPC layout xnu-8796 expects (later Xcode adds IORPC.kernelContent).
    # The kernel is still built for arm64; only the build machine changes.
    runs-on: macos-15-intel
    timeout-minutes: 240
    env:
      # Without MACOS_VERSION build.sh pops an interactive menu and dies.
      # 13.5 == xnu-8796 == the iOS 16 generation.
      MACOS_VERSION: "13.5"
      MACHINE_CONFIG: SWEET
      KERNEL_CONFIG: DEVELOPMENT
    steps:
      - uses: actions/checkout@v4
        with:
          path: device

      - name: Checkout ios-sweet (XNU 8796 build scripts + sweet platform patches)
        uses: actions/checkout@v4
        with:
          repository: dipa-studio/ios-sweet
          ref: 45263bee51df4a0f55cdf9c649af886399488ddb
          path: ios-sweet

      - name: Fetch darwin-xnu-build and stage the patches
        env:
          DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "https://github.com/blacktop/darwin-xnu-build" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # The ST-FTS (SE17) touch driver replaces ios-sweet's Goodix (SE7) one;
          # the andromeda touch is the same chip on the same bus (off by default).
          bash device/scripts/build-kernel-patches.sh ios-sweet
          cp ios-sweet/xnu/patches/*.patch ios-sweet/xnu/patches/*.sh dxb/patches/ 2>/dev/null || true
          cp device/xnu/cepheus_touch.c device/xnu/cepheus_fts_events.h device/xnu/cepheus_clock_status.h device/xnu/cepheus_gpi_layout.h dxb/patches/
          cp device/xnu/cepheus_i2c_bitbang.h dxb/patches/
          cp device/xnu/cepheus_soc.c device/xnu/cepheus_soc.h dxb/patches/
          cp device/xnu/cepheus_cpu_policy.h dxb/patches/
          python3 device/scripts/prepare-touch-power-patch.py ios-sweet/xnu/patches dxb/patches/0084-cepheus-touch-power.patch
          ls dxb/patches/ | grep -c . | xargs echo "patches staged:"
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -q 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh \
            || echo "::warning::ARCHS sed did not match; check that the kernel is plain arm64"

      - name: Host dependencies
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); stub it
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=/Applications/Xcode_16.2.app
          test -d "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build XNU 8796 (SWEET platform, arm64)
        working-directory: dxb
        env:
          MAKEFLAGS: '-k'
        run: bash build.sh

      - name: Stage the kernel as kernel.macho
        run: |
          mkdir -p out
          # Only a real 64-bit little-endian Mach-O (cffaedfe) over 2 MB: the
          # build tree also has text files named kernel.* (symbol lists).
          K=""
          while IFS= read -r f; do
            sz=$(wc -c < "$f" | tr -d ' ')
            [ "$sz" -gt 2000000 ] || continue
            magic=$(od -An -tx1 -N4 "$f" | tr -d ' \n')
            if [ "$magic" = "cffaedfe" ]; then K="$f"; break; fi
          done < <(find dxb -type f -name 'kernel*')
          [ -n "$K" ] || { echo "no Mach-O kernel found" >&2; exit 1; }
          echo "picked kernel: $K"
          python3 device/scripts/verify-touch-kernel.py "$K"
          cp "$K" out/kernel.macho
          shasum -a 256 out/kernel.macho | tee out/kernel.macho.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: andromeda-kernel
          path: |
            out/kernel.macho
            out/kernel.macho.sha256
          retention-days: 7
          if-no-files-found: error
